# FATADS — Расширенный демонстрационный лендинг рекламной платформы

Современный адаптивный промо-лендинг рекламной сети **FatAds** с тёмным UI, интерактивным дашбордом, калькулятором прогноза трафика, аккордеоном FAQ и клиентскими виджетами.

## Структура проекта

- `index.html` — семантическая разметка лендинга (Hero-дашборд, статистика, форматы трафика, преимущества, калькулятор ROI/кликов, шаги запуска, FAQ, форма заявки, модальное окно, чат и cookie-баннер).
- `style.css` — оформление в тёмной палитре (`#090b12` + неон `#b8ff55`), CSS-иллюстрации рекламных форматов, glassmorphism и полная адаптивность под мобильные устройства.
- `script.js` — вся клиентская интерактивность без сторонних библиотек (Vanilla JS):
  - мобильное burger-меню;
  - модальное окно статистики с фильтрацией по регионам (Tier-1, CIS, LATAM/Asia);
  - калькулятор кликов, показов и средней ставки в реальном времени;
  - FAQ-аккордеон;
  - валидация и демо-обработка формы лидов;
  - интерактивный виджет онлайн-чата с быстрыми ответами;
  - сохранение согласия на cookie в `localStorage` и кнопка плавного возврата наверх.

## Быстрый запуск

1. Скачайте или клонируйте репозиторий `FatAds_Pro`.
2. Откройте `index.html` в любом современном браузере или запустите через расширение **Live Server**.
3. Для кастомизации цветовой схемы измените CSS-переменные в начале файла `style.css` (`:root`).

## Важные примечания

- **Демо-режим:** форма заявок и чат поддержки работают на стороне браузера и не отправляют запросы на внешний сервер. Для продакшена подключите REST API / backend (например, Node.js, Python FastAPI или PHP + MySQL/PostgreSQL).
- **Данные:** метрики на графике, в калькуляторе и в таблице статистики являются демонстрационными ориентирами.
